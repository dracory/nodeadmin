name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Build
      run: go build -v ./...

    - name: Test with race detector
      run: go test -race ./...

    - name: Test
      run: go test -v ./...

    # Browser e2e (chromedp, //go:build e2e) — needs a real Chrome.
    - name: Set up Chrome
      id: chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: E2E tests
      env:
        NODEADMIN_E2E_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      run: go test -tags e2e -timeout 300s ./e2e/
